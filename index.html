<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Undertale Web — Fan Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#fff}body{display:grid;place-items:center;font-family:Georgia,serif;padding:12px}
#game-wrap{width:min(960px,100%)}#frame{border:4px solid #eee;background:#000;position:relative;line-height:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 2px;font:16px monospace}
#help{text-align:center;color:#aaa;font:13px monospace;line-height:1.5}
#dialogue{position:absolute;inset:0;display:none;align-items:flex-end;padding:4%;background:#0005;line-height:normal}
#dialogue.open{display:flex}#dialogue-box{width:100%;min-height:94px;border:4px solid white;background:#000;padding:14px 18px;font-size:clamp(17px,2.4vw,24px);line-height:1.35;white-space:pre-wrap}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #aaa;padding:7px 10px;font:13px monospace;display:none;line-height:normal}
@media(max-width:520px){body{padding:4px}#hud{font-size:12px}#dialogue-box{padding:10px;min-height:76px}}
</style>
</head>
<body>
<main id="game-wrap">
 <div id="frame">
  <canvas id="game" width="320" height="240" aria-label="Undertale Web game screen"></canvas>
  <div id="dialogue"><div id="dialogue-box"></div></div>
  <div id="toast"></div>
 </div>
 <div id="hud"><span id="stats">HEDGE  LV 1  HP 20/20</span><span id="gold">0 G</span><span id="room">THE RUINS</span></div>
 <div id="help">MOVE: Arrow Keys / WASD &nbsp; • &nbsp; INTERACT: Z / ENTER &nbsp; • &nbsp; SAVE: walk to the glowing star</div>
</main>
<script>
(()=> {
const c=document.querySelector('#game'),g=c.getContext('2d'),dialogue=document.querySelector('#dialogue'),dialogueBox=document.querySelector('#dialogue-box');
const stats=document.querySelector('#stats'),gold=document.querySelector('#gold'),roomLabel=document.querySelector('#room'),toast=document.querySelector('#toast');
const keys={};let mode='world',lines=[],line=0,room='ruins',lastStep=0,encounterSteps=0;
const player={x:160,y:175,hp:20,maxHp:20,lv:1,g:0,items:['Monster Candy'],speed:1.45};
const rooms={
ruins:{name:'THE RUINS',bg:'#21182f',floor:'#352744',wall:'#6b587b',npc:{x:160,y:91},exit:{x:282,y:35,w:22,h:36}},
snowdin:{name:'SNOWDIN',bg:'#101b30',floor:'#263951',wall:'#657f99',npc:{x:160,y:91},exit:{x:282,y:35,w:22,h:36}}
};
function hud(){stats.textContent='HEDGE  LV '+player.lv+'  HP '+player.hp+'/'+player.maxHp;gold.textContent=player.g+' G';roomLabel.textContent=rooms[room].name}
function box(textLines,done){mode='dialogue';lines=textLines;line=0;dialogueBox.textContent=lines[0];dialogue.classList.add('open');afterDialogue=done||(()=>{});}
let afterDialogue=()=>{};
function advance(){line++;if(line>=lines.length){dialogue.classList.remove('open');mode='world';const cb=afterDialogue;afterDialogue=()=>{};cb()}else dialogueBox.textContent=lines[line]}
function notify(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',1300)}
function save(){localStorage.setItem('undertale-web-save',JSON.stringify({room,player:{...player}}));notify('GAME SAVED.')}
function load(){try{const s=JSON.parse(localStorage.getItem('undertale-web-save'));if(s){room=rooms[s.room]?s.room:'ruins';Object.assign(player,s.player);}}catch(e){}hud()}
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}
function draw(){
const r=rooms[room];rect(0,0,320,240,r.bg);rect(18,18,284,204,r.floor);
g.strokeStyle='#ffffff12';g.lineWidth=1;for(let x=18;x<302;x+=16){g.beginPath();g.moveTo(x,18);g.lineTo(x,222);g.stroke()}for(let y=18;y<222;y+=16){g.beginPath();g.moveTo(18,y);g.lineTo(302,y);g.stroke()}
rect(12,12,296,8,r.wall);rect(12,220,296,8,r.wall);rect(12,12,8,216,r.wall);rect(300,12,8,216,r.wall);
rect(62,62,18,18,'#20172b');rect(240,150,18,18,'#20172b');
rect(r.exit.x,r.exit.y,r.exit.w,r.exit.h,'#d4c2a0');rect(r.exit.x+4,r.exit.y+5,r.exit.w-8,r.exit.h-5,'#57452f');
// SAVE star
g.fillStyle='#fff1a8';g.font='16px monospace';g.fillText('✦',34,205);
// simple placeholder NPC and player sprites
g.fillStyle='#b7a0c8';g.fillRect(r.npc.x-7,r.npc.y-8,14,16);g.fillStyle='#191323';g.fillRect(r.npc.x-4,r.npc.y-3,2,2);g.fillRect(r.npc.x+2,r.npc.y-3,2,2);
g.fillStyle='#e7c7a0';g.fillRect(Math.round(player.x-5),Math.round(player.y-8),10,13);g.fillStyle='#8d2028';g.fillRect(Math.round(player.x-5),Math.round(player.y-2),10,7);g.fillStyle='#fff';g.fillRect(Math.round(player.x-3),Math.round(player.y-6),2,2);g.fillRect(Math.round(player.x+1),Math.round(player.y-6),2,2);
g.fillStyle='#fff';g.font='8px monospace';g.fillText(r.name,25,34);
if(Math.hypot(player.x-r.npc.x,player.y-r.npc.y)<23)g.fillText('Z: TALK',r.npc.x-16,r.npc.y-14);
}
function interact(){
const n=rooms[room].npc;
if(Math.hypot(player.x-n.x,player.y-n.y)<24){box(room==='ruins'?['* A small frog watches you.','* It seems curious about your journey.']:['* A little snow creature waves.','* The cold does not seem to bother it.']);return}
if(player.x>270&&player.y<80){room=room==='ruins'?'snowdin':'ruins';player.x=42;player.y=185;hud();box(['* You travel to '+rooms[room].name+'.']);return}
if(player.x<58&&player.y>185){save();return}
box(['* Nothing but the sound of your footsteps.']);
}
function tick(t){
if(mode==='world'){
let dx=0,dy=0;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;
if(dx||dy){const m=Math.hypot(dx,dy);player.x+=dx/m*player.speed;player.y+=dy/m*player.speed;player.x=Math.max(27,Math.min(293,player.x));player.y=Math.max(43,Math.min(210,player.y));if(t-lastStep>150){lastStep=t;encounterSteps++;}}
draw();
}requestAnimationFrame(tick)}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if((e.key.toLowerCase()==='z'||e.key==='Enter')&&!e.repeat){if(mode==='dialogue')advance();else if(mode==='world')interact()}});
window.addEventListener('keyup',e=>keys[e.key]=false);
load();draw();requestAnimationFrame(tick);
})();
</script>
</body></html>
