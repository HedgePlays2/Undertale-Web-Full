<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08080b">
  <meta name="description" content="Undertale Web — an unofficial browser-based fan-game project.">
  <title>Undertale Web — Fan Game</title>
  <link rel="stylesheet" href="style.css?v=773a2e1">
</head>
<body>
  <div id="boot-status" style="position:fixed;inset:0;z-index:99998;display:grid;place-items:center;background:#000;color:#fff;font:16px monospace;text-align:center;padding:24px">UNDERTALE WEB — CHECKING GAME FILES…</div>
  <main id="game-wrap">
    <div id="frame">
      <canvas id="game" width="320" height="240" aria-label="Undertale Web game screen"></canvas>
    </div>
    <div id="hud">
      <span id="stats">HEDGE   LV 1   HP 20/20</span>
      <span id="gold">0 G</span>
      <span id="room">THE RUINS — ENTRANCE</span>
    </div>
    <div id="help">MOVE: ARROW KEYS / WASD &nbsp; • &nbsp; CONFIRM: Z / ENTER &nbsp; • &nbsp; CANCEL: X / ESC</div>
  </main>
  <script>
    window.addEventListener("error", function(e) {
      var box = document.getElementById("boot-status");
      if (box) box.textContent = "JAVASCRIPT ERROR: " + (e.message || "Script failed") + " | " + (e.filename || "") + ":" + (e.lineno || 0);
    });
  </script>
  <script src="game.js?v=e3474451" defer onerror="document.getElementById('boot-status').textContent='ERROR: game.js did not load. Check the GitHub Pages deployment.'"></script>
</body>
</html>
